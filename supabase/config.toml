# Atlas Assessment — Supabase project config.
# Conventions per Supabase CLI v1+. Most defaults are fine; per-project
# overrides go below.

project_id = "atlas-assessment"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# secure_password_change_required = true  # enable when wired to compliance §7

[storage]
enabled = true  # Item #13a Phase 1: question-images bucket for assessment images

[edge_runtime]
enabled = false  # not used in v1
