name: verify

# The verify bar, run on every PR into the protected branch. ATLAS-ASSESSMENT rejects
# direct pushes, so this is the gate before Dimitri merges a lane PR attended.
#
# No secrets are referenced. The suite must pass WITHOUT ANTHROPIC_API_KEY: the
# misconception classifier and report narration are fail-soft and flag-gated, and the
# test suite already mocks them. If a test ever needs a live key to pass, that is a bug
# in the test, not a reason to add a secret here.

on:
  pull_request:
    branches: [ATLAS-ASSESSMENT]

# Cancel an in-flight run when the PR head is updated, so only the latest commit is graded.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job name is the required-check identifier. Keep it stable: branch protection on
  # ATLAS-ASSESSMENT selects "verify-bar" as the required status check.
  verify-bar:
    name: verify-bar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed before setup-node so the pnpm store cache resolves.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Building also validates the app compiles. No secret is required: routes are
      # server-rendered on demand and narration/classifier are flag-gated/fail-soft,
      # so no live ANTHROPIC_API_KEY (or other secret) is read at build time.
      - name: Build
        run: pnpm build

  # ===========================================================================
  # ATLAS-017 — RLS / column-scope integration tests against a real database.
  # ===========================================================================
  #
  # SEPARATE JOB, running in PARALLEL with verify-bar so the fast bar stays fast.
  # These need Docker (Postgres + PostgREST + GoTrue), which is why they are not
  # in the unit suite: `pnpm test` must stay DB-free and runnable anywhere.
  #
  # Why a real stack rather than mocks: ATLAS-002's threat model is a direct
  # PATCH through the public PostgREST interface with a valid parent JWT. A
  # mocked client cannot reproduce that request, so it cannot prove it is
  # blocked. Everything here — roles, JWTs, RLS, column privileges, triggers —
  # is the real thing.
  #
  # No secrets: the local stack mints its own throwaway anon/service keys, read
  # back out of `supabase status`.
  rls-integration:
    name: rls-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies supabase/migrations/* then supabase/seed.sql to a fresh database,
      # so this also proves every migration — including the ATLAS-002 one — still
      # applies cleanly from scratch.
      - name: Start Supabase
        run: supabase start

      - name: Export Supabase connection details
        run: |
          supabase status -o json > /tmp/supabase-status.json
          echo "SUPABASE_URL=$(jq -r '.API_URL' /tmp/supabase-status.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY' /tmp/supabase-status.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY' /tmp/supabase-status.json)" >> "$GITHUB_ENV"

      - name: RLS integration tests
        run: pnpm test:integration

      - name: Supabase service logs (on failure)
        if: failure()
        run: supabase status || true
